configuration:
  num_zones:
    name: Number of zones (fallback)
    description: >-
      Normally leave this: the zones come from the room's setup in the PHASE Steering UI.
      This value is only used if Home Assistant isn't reachable at startup. Map more probes
      per zone in the PHASE Steering UI - the engine reads each zone's combined
      sensor.crop_steering_vwc_zone_N / ec_zone_N (their average unless you choose another
      way to combine them).
  lights_on_hour:
    name: Lights-on hour (fallback)
    description: >-
      Lights are read live from the integration (number.crop_steering_lights_on_hour) so you
      set them ONCE in the PHASE Steering UI. This option is only a fallback used if that
      entity is missing. Hour 0-23; lights-on starts the grow-day.
  lights_off_hour:
    name: Lights-off hour (fallback)
    description: >-
      Fallback only - lights are read live from the integration
      (number.crop_steering_lights_off_hour). Hour 0-23; at lights-off every zone is forced
      into the overnight dry-back phase (P3).
  enable_flag:
    name: Kill-switch entity
    description: >-
      Normally leave this as input_boolean.f2_control_enabled. Every room made by the
      setup wizard has its own watering switch (Engine Enabled, switched from the
      PHASE Steering Overview), and the controller uses that while no such helper exists.
      Only a room from before the wizard is gated by an input_boolean helper: name
      yours here if it is called something else. While the switch is OFF the engine
      reads sensors and makes decisions but NEVER opens a valve.
  notify_service:
    name: Notification service
    description: >-
      Where to send vitals and alerts. Use the path form notify/<your_service>,
      for example notify/mobile_app_my_phone. Find yours in
      Developer Tools > Actions by typing "notify".
  notify_min:
    name: Minutes between routine notifications
    description: >-
      Minimum minutes between routine "vitals" messages so you are not spammed.
      Urgent alerts ignore this throttle. Default 30.
  instance_name:
    name: Name in notifications
    description: >-
      The title of the controller's vitals notifications, for example
      "PHASE Steering vitals". Change it to tell two installations apart.
  hold_entities:
    name: Hold entities (optional)
    description: >-
      Entities that pause watering while they are on, such as the input_boolean
      a dosing or tank-fill automation turns on while it works. While any of them
      is on, no shot starts, and a shot already running ends and counts only the
      water it gave. Empty by default: nothing holds.
  substrate_l:
    name: Fallback substrate volume (L per plant)
    description: >-
      Last-resort fallback ONLY, used if the integration's per-zone
      substrate_volume number is unset. The generic default is a safe
      placeholder - set your real per-plant block size in the PHASE Steering UI.
      Normally leave this: real shot sizing is read live from your per-zone
      hardware numbers (substrate_volume x plant_count).
  flow_lps:
    name: Fallback drip flow (L per second)
    description: >-
      Last-resort fallback ONLY, used if the per-zone flow cannot be computed
      from your plant count and dripper settings. The generic default is a safe
      placeholder. Normally leave this: real flow is
      plant_count x drippers_per_plant x dripper_flow_rate.
  loop_seconds:
    name: Decision interval (seconds)
    description: >-
      How often the engine wakes to read sensors and decide. Default 60. Lower
      reacts faster but makes more Home Assistant API calls.
  rediscover_seconds:
    name: Seconds between setup checks
    description: >-
      How often the controller looks for new rooms and for setup changes saved
      in the PHASE Steering page. Default 300 (five minutes).
